<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="shortcut icon" href="/favicon.png" />
    <title>Home</title>

    <link rel="stylesheet" href="/assets/css/global.css" />
    <link rel="stylesheet" href="/assets/css/auth.css" />

    <script src="/assets/js/auth.js" defer></script>
</head>

<body>
    <main class="auth-page">
        <section class="auth-card">
            <a class="auth-brand" href="/">Novaris</a>

            <h1>Create account</h1>
            <p class="auth-subtitle">
                Create your private Novaris account.
            </p>

            <form id="signup-form" novalidate>
                <label for="username">Username</label>
                <input id="username" name="username" type="text" minlength="3" maxlength="20"
                    pattern="[A-Za-z0-9_]{3,20}" autocomplete="username" placeholder="Username" required />

                <p class="field-help">
                    3–20 characters. Letters, numbers, and underscores only.
                </p>

                <label for="email">Email address</label>
                <input id="email" name="email" type="email" autocomplete="email" placeholder="Email address" required />

                <label for="password">Password</label>
                <input id="password" name="password" type="password" minlength="8" autocomplete="new-password"
                    placeholder="Password" required />

                <label for="confirm-password">Confirm password</label>
                <input id="confirm-password" name="confirmPassword" type="password" minlength="8"
                    autocomplete="new-password" placeholder="Confirm password" required />

                <label for="invite-code">One-time invite code</label>
                <input id="invite-code" name="inviteCode" type="text" autocomplete="off" placeholder="NOVA-XXXX-XXXX"
                    required />

                <label class="terms-row">
                    <input id="terms" name="terms" type="checkbox" required />
                    <span>
                        I understand that each account is for one person only and that
                        proxy searches and the first prompt of a Novaris AI conversation may
                        be visible to the site owner.
                    </span>
                </label>

                <div id="auth-message" class="auth-message" aria-live="polite"></div>

                <button id="signup-button" type="submit">
                    Create account
                </button>
            </form>

            <p class="auth-switch">
                Already have an account?
                <a href="/login">Sign in</a>
            </p>
        </section>
    </main>
  <script src="/assets/js/site-control.js" defer></script>
</body>

</html>
