<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="shortcut icon" href="/favicon.png" />

    <title>Sign In | FuzzTheHuzz</title>

    <link rel="stylesheet" href="/assets/css/global.css" />

    <link rel="stylesheet" href="/assets/css/auth.css" />

    <script type="module" src="/assets/js/login.js"></script>
</head>

<body>
    <main class="auth-page">
        <section class="auth-card">
            <a class="auth-brand" href="/">
                FuzzTheHuzz
            </a>

            <h1>Sign in</h1>

            <p class="auth-subtitle">
                Sign in to access FuzzTheHuzz.
            </p>

            <form id="login-form" novalidate>
                <label for="email">
                    Email address
                </label>

                <input id="email" name="email" type="email" autocomplete="email" placeholder="Email address" required />

                <label for="password">
                    Password
                </label>

                <input id="password" name="password" type="password" autocomplete="current-password"
                    placeholder="Password" required />

                <div id="auth-message" class="auth-message" aria-live="polite"></div>

                <button id="login-button" type="submit">
                    Sign in
                </button>
            </form>

            <p class="auth-switch">
                Don’t have an account?
                <a href="/signup">
                    Create account
                </a>
            </p>
        </section>
    </main>
</body>

</html>
