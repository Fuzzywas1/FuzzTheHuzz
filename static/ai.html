<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="shortcut icon" href="/favicon.png" />
    <title>Fuzz AI</title>

    <link rel="stylesheet" href="/assets/css/global.css" />
    <link rel="stylesheet" href="/assets/css/nav.css" />
    <link rel="stylesheet" href="/assets/css/ai.css" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <script src="/assets/js/m1.js" defer></script>
    <script src="/assets/js/ai.js" defer></script>
</head>

<body>
    <div class="f-nav"></div>

    <main class="ai-page">
        <section id="welcome-screen" class="ai-welcome">
            <h1>Fuzz AI</h1>
            <p>What can I help you with?</p>
        </section>

        <section id="chat-messages" class="chat-messages" aria-live="polite"></section>

        <form id="chat-form" class="chat-composer">
            <div id="image-preview-area" class="image-preview-area"></div>
        
            <div class="composer-row">
                <input id="image-input" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden />
        
                <button id="attach-button" class="attach-button" type="button" aria-label="Attach image" title="Attach image">
                    <i class="fa-solid fa-paperclip"></i>
                </button>
        
                <textarea id="chat-input" rows="1" maxlength="12000" placeholder="Message Fuzz AI"></textarea>
        
                <button id="send-button" class="send-button" type="submit" aria-label="Send message">
                    <i class="fa-solid fa-arrow-up"></i>
                </button>
            </div>
        </form>
    </main>
</body>

</html>
