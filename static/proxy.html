<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="referrer" content="no-referrer" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#050713" />
  <link rel="shortcut icon" href="/assets/media/favicon/classroom.png" />
  <title>Home</title>
  <link rel="stylesheet" href="/assets/css/nav.css?v=13" />
  <link rel="stylesheet" href="/assets/css/proxy.css?v=4" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <script src="/baremux/index.js"></script>
  <script src="/scram/scramjet.all.js"></script>
  <script src="/assets/mathematics/bundle.js"></script>
  <script src="/assets/mathematics/config.js"></script>
  <script src="/assets/js/proxy-engine.js?v=4"></script>
</head>
<body>
  <div class="f-nav"></div>
  <header class="proxy-toolbar">
    <button id="proxy-back-home" type="button" title="Back to Fuzz"><i class="fa-solid fa-house"></i></button>
    <form id="proxy-address-form">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input id="proxy-address" type="text" placeholder="Search or enter a URL" autocomplete="off" />
    </form>
    <select id="proxy-engine-select" data-proxy-engine-select aria-label="Proxy engine">
      <option value="scramjet">Scramjet · Recommended</option>
      <option value="ultraviolet">Ultraviolet · Legacy</option>
    </select>
    <button id="proxy-reload" type="button" title="Reload"><i class="fa-solid fa-rotate-right"></i></button>
    <button id="proxy-fullscreen" type="button" title="Enter full screen"><i class="fa-solid fa-expand"></i></button>
  </header>
  <div class="proxy-focus-controls" id="proxy-focus-controls" aria-label="Fuzz Cloud controls">
    <button id="proxy-focus-home" type="button" title="Back to Fuzz Cloud"><i class="fa-solid fa-cloud"></i></button>
    <button id="proxy-focus-reload" type="button" title="Reload desktop"><i class="fa-solid fa-rotate-right"></i></button>
    <button id="proxy-focus-fullscreen" type="button" title="Enter full screen"><i class="fa-solid fa-expand"></i></button>
    <button id="proxy-exit-focus" type="button" title="Show browser controls"><i class="fa-solid fa-compress"></i></button>
  </div>
  <main id="proxy-frame-host" class="proxy-frame-host">
    <div id="proxy-loading" class="proxy-loading"><span></span><strong>Starting <span data-proxy-engine-label>Scramjet</span>…</strong></div>
  </main>
  <script src="/assets/js/standalone-proxy.js?v=2"></script>
  <script src="/assets/js/m1.js?v=14" defer></script>
</body>
</html>
