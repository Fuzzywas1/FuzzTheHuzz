<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#050713" />

  <link rel="shortcut icon" id="tab-favicon" href="/assets/media/favicon/classroom.png" />
  <title id="t">Home</title>

  <link rel="stylesheet" href="/assets/css/global.css?v=6" />
  <link rel="stylesheet" href="/assets/css/apps.css?v=4" />
  <link rel="stylesheet" href="/assets/css/games.css?v=1" />
  <link rel="stylesheet" href="/assets/css/nav.css?v=13" />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  />

  <script src="/baremux/index.js"></script>
  <script src="/scram/scramjet.all.js"></script>
  <script src="/assets/js/proxy-engine.js?v=4"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="/assets/js/doge-local-gm-loader.js?v=1"></script>

  <link rel="stylesheet" href="/assets/css/fuzz-ui.css?v=1" />
  <script src="/assets/js/fuzz-ui.js?v=1"></script>
</head>

<body class="apps-page games-page">
  <div class="apps-backdrop" aria-hidden="true">
    <span class="apps-orb apps-orb-one"></span>
    <span class="apps-orb apps-orb-two"></span>
    <span class="apps-grid-glow"></span>
  </div>

  <div class="f-nav"></div>

  <main class="apps-shell">
    <header class="apps-page-header">
      <div>
        <div class="apps-eyebrow">
          <span class="apps-eyebrow-dot"></span>
          Fuzz games
        </div>
        <h1>Games</h1>
        <p>DogeUB's game library, running through Fuzz.</p>
      </div>
    </header>

    <section class="apps-workspace">
      <aside class="apps-sidebar">
        <div class="apps-sidebar-heading">
          <span>Browse</span>
          <small>Find a game</small>
        </div>

        <section class="apps-command-bar">
          <label class="apps-search-wrap" for="game-search">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input
              id="game-search"
              type="search"
              autocomplete="off"
              spellcheck="false"
              placeholder="Search games"
            />
            <kbd>/</kbd>
          </label>
        </section>

        <div class="apps-sidebar-label">Categories</div>
        <section class="apps-category-strip">
          <div id="game-category-chips" class="apps-category-chips"></div>
        </section>

        <div id="games-status" class="apps-status-row" aria-live="polite">
          Loading games...
        </div>
      </aside>

      <div class="apps-content">
        <section class="apps-section apps-all-section">
          <div class="apps-section-heading apps-all-heading">
            <div>
              <span class="apps-section-kicker">Library</span>
              <h2 id="game-section-title">All games</h2>
            </div>
            <span id="game-count" class="apps-count-pill">0 games</span>
          </div>

          <div id="games-loading" class="apps-loading-grid">
            <span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span>
          </div>

          <div id="all-games" class="apps-grid" hidden></div>

          <div id="games-empty" class="apps-empty" hidden>
            <div class="apps-empty-icon">
              <i class="fa-solid fa-gamepad"></i>
            </div>
            <h3>No games found</h3>
            <p>Try another search or category.</p>
            <button class="apps-secondary-button" id="reset-game-filters" type="button">
              Reset filters
            </button>
          </div>

          <div id="games-error" class="apps-empty" hidden>
            <div class="apps-empty-icon">
              <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <h3>Games could not load</h3>
            <p id="games-error-message"></p>
            <button class="apps-secondary-button" id="retry-games" type="button">
              Try again
            </button>
          </div>
        </section>
      </div>
    </section>
  </main>

  <div id="apps-toast-region" class="apps-toast-region" aria-live="polite"></div>

  <script src="/assets/js/games.js?v=2"></script>
  <script src="/assets/js/m1.js?v=15"></script>
  <script src="/assets/js/account-shell.js?v=1" defer></script>
  <script src="/assets/js/site-control.js" defer></script>
</body>
</html>
