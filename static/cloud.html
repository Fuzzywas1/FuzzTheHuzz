<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#050713" />

  <link id="tab-favicon" rel="shortcut icon" href="/assets/media/favicon/classroom.png" />
  <title>Home</title>

  <link rel="stylesheet" href="/assets/css/global.css?v=7" />
  <link rel="stylesheet" href="/assets/css/nav.css?v=13" />
  <link rel="stylesheet" href="/assets/css/cloud.css?v=4" />
  <link rel="stylesheet" href="/assets/css/fuzz-ui.css?v=1" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <script src="/assets/js/fuzz-ui.js?v=1"></script>
  <script src="/assets/js/fuzz-diagnostics.js?v=1"></script>
  <script src="/assets/js/m1.js?v=15" defer></script>
  <script src="/assets/js/cloud.js?v=11" defer></script>
</head>

<body class="fuzz-cloud-page">
  <div class="cloud-backdrop" aria-hidden="true">
    <span class="cloud-orb cloud-orb-one"></span>
    <span class="cloud-orb cloud-orb-two"></span>
    <span class="cloud-grid"></span>
  </div>

  <div class="f-nav"></div>

  <main class="cloud-shell">
    <header class="cloud-app-header">
      <div>
        <p class="cloud-eyebrow"><span></span> Remote desktop</p>
        <h1>Novaris Cloud</h1>
        <p class="cloud-header-copy">Your Windows PC, without the extra gateway screens.</p>
      </div>
      <span class="cloud-security-pill">
        <i class="fa-solid fa-shield-halved" aria-hidden="true"></i>
        noVNC + Cloudflare
      </span>
    </header>

    <section class="cloud-device-card" aria-labelledby="cloud-device-name">
      <div class="cloud-device-visual" aria-hidden="true">
        <div class="cloud-monitor">
          <div class="cloud-monitor-top"><span></span><span></span><span></span></div>
          <div class="cloud-monitor-screen">
            <div class="cloud-screen-glow"></div>
            <span class="cloud-screen-logo"><i class="fa-brands fa-windows"></i></span>
            <small>Remote PC</small>
          </div>
        </div>
        <div class="cloud-monitor-stand"></div>
      </div>

      <div class="cloud-device-content">
        <div class="cloud-device-heading">
          <span class="cloud-device-icon"><i class="fa-solid fa-desktop" aria-hidden="true"></i></span>
          <span><small>Your computer</small><strong id="cloud-device-name">Loading…</strong></span>
        </div>

        <div class="cloud-status-row" id="cloud-status" data-state="loading" aria-live="polite">
          <span class="cloud-status-dot"></span><span>Checking Novaris Cloud…</span>
        </div>

        <p class="cloud-device-description" id="cloud-description">
          Loading your noVNC connection…
        </p>

        <button class="cloud-launch-button" id="cloud-launch" type="button" disabled>
          <span class="cloud-launch-icon"><i class="fa-solid fa-display" aria-hidden="true"></i></span>
          <span class="cloud-launch-copy"><strong>Connect to PC</strong><small>Open your Windows desktop</small></span>
          <i class="fa-solid fa-arrow-right cloud-launch-arrow" aria-hidden="true"></i>
        </button>

        <div class="cloud-secondary-actions">
          <button class="cloud-secondary-button" id="cloud-direct" type="button" disabled>
            <i class="fa-solid fa-up-right-from-square" aria-hidden="true"></i>Open in new tab
          </button>
          <span><i class="fa-solid fa-lock" aria-hidden="true"></i>Your VNC password is still required.</span>
        </div>

        <div class="cloud-launch-message" id="cloud-message" role="status"></div>

        <div class="cloud-simple-path" aria-label="Connection path">
          <span><i class="fa-solid fa-browser"></i>Browser</span>
          <i class="fa-solid fa-angle-right"></i>
          <span><i class="fa-solid fa-cloud"></i>Cloudflare</span>
          <i class="fa-solid fa-angle-right"></i>
          <span><i class="fa-solid fa-display"></i>noVNC</span>
          <i class="fa-solid fa-angle-right"></i>
          <span><i class="fa-brands fa-windows"></i>Your PC</span>
        </div>
      </div>
    </section>


  </main>

  <script src="/assets/js/account-shell.js?v=1" defer></script>
  <script src="/assets/js/site-control.js?v=3" defer></script>
</body>
</html>
