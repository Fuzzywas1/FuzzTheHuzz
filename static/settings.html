<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="shortcut icon" href="/favicon.png" />
  <title>Home</title>
  <meta http-equiv="refresh" content="0;url=/account#preferences" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
      color: #f5f7ff;
      background: radial-gradient(circle at top, #111831, #02030a 68%);
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    }
    main {
      width: min(440px, calc(100% - 32px));
      padding: 24px;
      border: 1px solid rgba(148, 161, 255, .18);
      border-radius: 18px;
      background: rgba(10, 15, 31, .9);
      text-align: center;
    }
    p { color: #a7b0ca; line-height: 1.6; }
    a {
      display: inline-flex;
      min-height: 40px;
      align-items: center;
      padding: 0 14px;
      border-radius: 11px;
      color: white;
      background: linear-gradient(135deg, #6878f4, #7956e8);
      font-weight: 800;
      text-decoration: none;
    }
  </style>
  <script>
    window.location.replace('/account#preferences');
  </script>
  <link rel="stylesheet" href="/assets/css/fuzz-ui.css?v=1" />
  <script src="/assets/js/fuzz-ui.js?v=1"></script>
  <script src="/assets/js/fuzz-diagnostics.js?v=1"></script>
</head>
<body>
  <main>
    <h1>Settings moved</h1>
    <p>Settings are now part of My Account so account preferences and browser settings stay together.</p>
    <a href="/account#preferences">Open Settings</a>
  </main>
</body>
</html>
