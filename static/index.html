  <script>
    (() => {
      const canvas = document.getElementById("stars");
      const context = canvas.getContext("2d");
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      let width = 0;
      let height = 0;
      let pixelRatio = 1;
      let stars = [];

      function resizeCanvas() {
        width = window.innerWidth;
        height = window.innerHeight;
        pixelRatio = Math.min(window.devicePixelRatio || 1, 2);

        canvas.width = Math.floor(width * pixelRatio);
        canvas.height = Math.floor(height * pixelRatio);
        canvas.style.width = `${width}px`;
        canvas.style.height = `${height}px`;
        context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);

        const starCount = Math.max(70, Math.min(180, Math.floor((width * height) / 8500)));
        stars = Array.from({ length: starCount }, () => ({
          x: Math.random() * width,
          y: Math.random() * height,
          radius: Math.random() * 1.35 + 0.2,
          speed: Math.random() * 0.12 + 0.025,
          opacity: Math.random() * 0.65 + 0.2,
          pulse: Math.random() * Math.PI * 2,
        }));
      }

      function draw(time = 0) {
        context.clearRect(0, 0, width, height);

        for (const star of stars) {
          const twinkle = reduceMotion
            ? star.opacity
            : star.opacity + Math.sin(time * 0.0012 + star.pulse) * 0.12;

          context.beginPath();
          context.fillStyle = `rgba(221, 231, 255, ${Math.max(0.08, twinkle)})`;
          context.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
          context.fill();

          if (!reduceMotion) {
            star.y += star.speed;
            if (star.y > height + 3) {
              star.y = -3;
              star.x = Math.random() * width;
            }
          }
        }

        if (!reduceMotion) {
          window.requestAnimationFrame(draw);
        }
      }

      resizeCanvas();
      draw();
      window.addEventListener("resize", resizeCanvas, { passive: true });
    })();
  </script>
