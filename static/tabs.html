<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="referrer" content="no-referrer" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Home</title>
  <link
    id="tab-favicon"
    rel="shortcut icon"
    href="/assets/media/favicon/classroom.png"
  />
  <link
    rel="stylesheet"
    href="/assets/css/t.css?v=11"
  />
  <link rel="stylesheet" href="/assets/css/nav.css?v=14" />
  <link rel="stylesheet" href="/assets/css/fuzz-ui.css?v=1" />

  <script src="/assets/js/fuzz-ui.js?v=1"></script>
  <script src="/assets/js/fuzz-diagnostics.js?v=1"></script>
  <script src="/assets/js/fuzz-browser-data.js?v=1"></script>
  <script src="/baremux/index.js"></script>
  <script src="/scram/scramjet.all.js"></script>

  <script src="/assets/mathematics/bundle.js?v=2025-04-15"></script>
  <script src="/assets/mathematics/config.js?v=2025-04-15"></script>

  <script src="/assets/js/proxy-engine.js?v=4"></script>
</head>

<body>
  <div class="f-nav"></div>
  <header class="browser-shell" id="browser-shell">
    <div class="tab-strip">
      <button
        class="browser-brand"
        id="browser-brand"
        type="button"
        title="Return to Novaris Home"
        aria-label="Return to Novaris Home"
      >
        <span>F</span>
      </button>

      <div class="tabs-scroller" id="tabs-scroller">
        <div
          class="tabs-list"
          id="tab-list"
          role="tablist"
          aria-label="Browser tabs"
        ></div>
      </div>

      <button
        class="chrome-button add-tab-button"
        id="add-tab"
        type="button"
        title="New tab (Ctrl+T)"
        aria-label="New tab"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 5v14M5 12h14" />
        </svg>
      </button>

      <button
        class="chrome-button tab-strip-action"
        id="collapse-tabs"
        type="button"
        title="Hide tab strip"
        aria-label="Hide tab strip"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m7 14 5-5 5 5" />
        </svg>
      </button>
    </div>

    <div class="browser-toolbar">
      <div class="navigation-controls">
        <button
          class="chrome-button"
          id="home-page"
          type="button"
          title="Novaris Home"
          aria-label="Novaris Home"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m3 11 9-8 9 8" />
            <path d="M5.5 10v10h13V10" />
            <path d="M9.5 20v-6h5v6" />
          </svg>
        </button>

        <button
          class="chrome-button"
          id="back-button"
          type="button"
          title="Back (Alt+Left)"
          aria-label="Back"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m15 18-6-6 6-6" />
          </svg>
        </button>

        <button
          class="chrome-button"
          id="forward-button"
          type="button"
          title="Forward (Alt+Right)"
          aria-label="Forward"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m9 18 6-6-6-6" />
          </svg>
        </button>

        <button
          class="chrome-button"
          id="reload-button"
          type="button"
          title="Reload (Ctrl+R)"
          aria-label="Reload"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 11a8 8 0 1 0-2.34 5.66" />
            <path d="M20 4v7h-7" />
          </svg>
        </button>
      </div>

      <form
        class="address-form"
        id="fv"
        autocomplete="off"
      >
        <span
          class="address-status"
          id="address-status"
          title="Ready"
          aria-hidden="true"
        >
          <svg viewBox="0 0 24 24">
            <path d="M12 3 5.5 6v5.4c0 4.1 2.7 7.9 6.5 9.1 3.8-1.2 6.5-5 6.5-9.1V6L12 3Z" />
            <path d="m9.5 12 1.7 1.7 3.5-3.7" />
          </svg>
        </span>

        <input
          id="input"
          class="address-input"
          type="text"
          inputmode="url"
          placeholder="Search the web or enter a URL"
          aria-label="Search or enter a URL"
          spellcheck="false"
          autocapitalize="off"
          autocomplete="off"
        />

        <button
          class="address-clear"
          id="clear-address"
          type="button"
          title="Clear"
          aria-label="Clear address"
          hidden
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m8 8 8 8M16 8l-8 8" />
          </svg>
        </button>

        <span
          class="address-shortcut"
          id="address-shortcut"
          aria-hidden="true"
        >
          Ctrl L
        </span>

        <span class="load-progress" id="load-progress"></span>
      </form>

      <label
        class="engine-picker"
        title="Choose proxy engine"
      >
        <span
          class="engine-dot"
          id="engine-dot"
          aria-hidden="true"
        ></span>

        <span class="engine-copy">
          <strong id="engine-label">Scramjet</strong>
          <small id="engine-description">Recommended</small>
        </span>

        <select
          id="tabs-proxy-engine"
          data-proxy-engine-select
          aria-label="Proxy engine"
        >
          <option value="scramjet">
            Scramjet — Recommended
          </option>
          <option value="ultraviolet">
            Ultraviolet — Legacy
          </option>
        </select>

        <svg
          class="engine-chevron"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path d="m8 10 4 4 4-4" />
        </svg>
      </label>

      <div class="toolbar-actions">
        <button
          class="chrome-button bookmark-button"
          id="bookmark-button"
          type="button"
          title="Bookmark current page"
          aria-label="Bookmark current page"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3l-5.6 2.9 1.1-6.2L3 9.6l6.2-.9L12 3Z" />
          </svg>
        </button>

        <button
          class="chrome-button"
          id="popout-button"
          type="button"
          title="Open current page in a separate Novaris window"
          aria-label="Open in separate window"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M14 5h5v5" />
            <path d="m19 5-8 8" />
            <path d="M19 13v6H5V5h6" />
          </svg>
        </button>

        <button
          class="chrome-button"
          id="fullscreen-button"
          type="button"
          title="Game fullscreen"
          aria-label="Game fullscreen"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5" />
          </svg>
        </button>

        <button
          class="chrome-button more-button"
          id="more-button"
          type="button"
          title="Browser menu"
          aria-label="Browser menu"
          aria-expanded="false"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="5" cy="12" r="1" />
            <circle cx="12" cy="12" r="1" />
            <circle cx="19" cy="12" r="1" />
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main
    class="browser-viewport"
    id="frame-container"
    aria-live="polite"
  ></main>

  <div
    class="browser-menu"
    id="browser-menu"
    hidden
  >
    <button type="button" data-menu-action="new-tab">
      <span>New tab</span>
      <kbd>Ctrl T</kbd>
    </button>

    <button type="button" data-menu-action="home">
      <span>Novaris Home</span>
    </button>

    <button type="button" data-menu-action="popout">
      <span>Open in separate window</span>
    </button>

    <button type="button" data-menu-action="fullscreen">
      <span>Game fullscreen</span>
      <kbd>F11</kbd>
    </button>

    <hr />

    <button type="button" data-menu-action="bookmarks"><span>Bookmarks</span><kbd>Ctrl B</kbd></button>
    <button type="button" data-menu-action="recent"><span>Recently visited</span></button>
    <button type="button" data-menu-action="closed"><span>Recently closed</span><kbd>Ctrl Shift T</kbd></button>
    <button type="button" data-menu-action="status"><span>System status</span></button>
    <button type="button" data-menu-action="changelog"><span>What's new</span></button>

    <hr />

    <button type="button" data-menu-action="clear-browsing-data">
      <span>Clear browsing session</span>
    </button>
  </div>

  <aside class="browser-library" id="browser-library" hidden aria-label="Browsing library">
    <header class="browser-library-header">
      <div><strong id="browser-library-title">Bookmarks</strong><span>Saved and recent pages</span></div>
      <button id="library-close" type="button" aria-label="Close library">×</button>
    </header>
    <nav class="browser-library-tabs" aria-label="Library sections">
      <button class="is-active" type="button" data-library-section="bookmarks">Bookmarks</button>
      <button type="button" data-library-section="recent">Recent</button>
      <button type="button" data-library-section="closed">Closed</button>
    </nav>
    <div class="browser-library-content" id="browser-library-content"></div>
    <footer class="browser-library-footer">
      <button id="library-add-current" type="button">Save current page</button>
      <button id="library-import" type="button">Import</button>
      <button id="library-export" type="button">Export</button>
    </footer>
  </aside>
  <input id="bookmark-import-file" type="file" accept="application/json,.json" hidden />

  <div
    class="browser-toast-region"
    id="browser-toast-region"
    aria-live="polite"
  ></div>

  <script src="/assets/js/fuzz-fullscreen.js?v=1"></script>
  <script src="/assets/js/t3.js?v=12"></script>
  <script src="/assets/js/tabs-plus.js?v=1"></script>
  <script src="/assets/js/m1.js?v=16"></script>
  <script src="/assets/js/account-shell.js?v=1" defer></script>
  <script src="/assets/js/site-control.js" defer></script>
</body>
</html>
